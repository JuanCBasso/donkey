name: CI - Unit Tests

on:
  push:
    branches: [main, master, 'mule-4.*']
  pull_request:
    branches: [main, master, 'mule-4.*']

env:
  MAVEN_OPTS: -Xmx2g -XX:+UseG1GC

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 http://maven.apache.org/xsd/settings-1.2.0.xsd">
            <servers>
              <server>
                <id>mule</id>
                <username>${env.MULE_NEXUS_USER}</username>
                <password>${env.MULE_NEXUS_PASSWORD}</password>
              </server>
              <server>
                <id>mule-plugin</id>
                <username>${env.MULE_NEXUS_USER}</username>
                <password>${env.MULE_NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          MULE_NEXUS_USER: ${{ secrets.MULE_NEXUS_USER }}
          MULE_NEXUS_PASSWORD: ${{ secrets.MULE_NEXUS_PASSWORD }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build (skip tests)
        run: mvn install -DskipTests -DskipVerifications -T 1C --batch-mode --no-transfer-progress

      - name: Run Unit Tests
        run: mvn test -DskipVerifications -DskipFunctionalTests -DskipIntegrationTests -DskipSystemTests -DskipPerformanceTests -T 1C --batch-mode --no-transfer-progress -Dsurefire.useFile=false

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  build-core-tests:
    name: Core Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 http://maven.apache.org/xsd/settings-1.2.0.xsd">
            <servers>
              <server>
                <id>mule</id>
                <username>${env.MULE_NEXUS_USER}</username>
                <password>${env.MULE_NEXUS_PASSWORD}</password>
              </server>
              <server>
                <id>mule-plugin</id>
                <username>${env.MULE_NEXUS_USER}</username>
                <password>${env.MULE_NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          MULE_NEXUS_USER: ${{ secrets.MULE_NEXUS_USER }}
          MULE_NEXUS_PASSWORD: ${{ secrets.MULE_NEXUS_PASSWORD }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build dependencies (skip tests)
        run: mvn install -DskipTests -DskipVerifications -pl errors,runtime-extension-model,core,tests/unit -am -T 1C --batch-mode --no-transfer-progress

      - name: Run core-tests
        run: mvn test -DskipVerifications -pl core-tests --batch-mode --no-transfer-progress -Dsurefire.useFile=false

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-surefire-reports
          path: 'core-tests/target/surefire-reports/'
          retention-days: 7
